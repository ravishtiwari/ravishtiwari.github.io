eyebrow: Solutions Architect // Cloud · DevOps · MLOps · Security
headline: Analyze the<br><span class="primary">problem first.</span><br><span class="tertiary">Pick the tool.</span>
intro: Fifteen-plus years turning customer pain points into production systems across <strong>AWS, GCP, and Azure</strong>, from multi-account landing zones to <strong>GenAI inference at scale</strong>. I build <strong>MLOps pipelines</strong> with experiment tracking, orchestrate workloads on <strong>Kubernetes</strong> (GKE and self-hosted HA clusters), and embed <strong>DevSecOps gates</strong> — SonarQube, Fortify, Trivy, Secret Scan — inline in CI. I optimize for the problem in front of me, not the stack I already know.
